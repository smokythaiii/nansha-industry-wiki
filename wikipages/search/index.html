<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>搜索 - 南沙产业知识图谱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="search-page">
    <div class="page-shell search-shell">
      <header class="topbar search-topbar" aria-label="Main navigation">
        <a class="brand" href="../index.html" aria-label="南沙产业知识图谱 home">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span>南沙产业知识图谱</span>
        </a>

        <nav class="icon-nav" aria-label="Utility navigation">
          <button aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.4 14.8A8.4 8.4 0 0 1 9.2 3.6 8.7 8.7 0 1 0 20.4 14.8Z" />
            </svg>
          </button>
          <button aria-label="Help menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.4 9a3 3 0 1 1 4.9 2.3c-1 .8-1.5 1.2-1.5 2.7" />
              <path d="M12 17.6h.01" />
              <circle cx="12" cy="12" r="9" />
            </svg>
          </button>
        </nav>
      </header>

      <main class="search-main">
        <form class="search-panel search-form" action="./" aria-label="搜索产业、企业、政策、项目或技术路线">
          <input
            id="search-query"
            name="q"
            type="search"
            autocomplete="off"
            placeholder="搜索产业、企业、政策、项目或技术路线"
          />
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.2-4.2m1.2-5.3a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />
            </svg>
          </button>
        </form>

        <section class="search-empty" aria-live="polite">
          <div class="search-icon" aria-hidden="true">
            <span class="mini-mark"></span>
            <svg viewBox="0 0 48 48">
              <path d="M30 30 39 39" />
              <circle cx="21" cy="21" r="10" />
              <path d="M8 12h7M8 21h4M8 30h9" />
            </svg>
          </div>
          <p class="search-empty-title">输入你要查找的产业、企业、政策或项目。</p>
          <p class="search-empty-subtitle">结果将随着输入实时显示。</p>
        </section>

        <section class="search-results" aria-label="搜索结果"></section>
      </main>

      <footer class="search-footer">
        <span>Google for Developers</span>
        <nav aria-label="Footer">
          <a href="#">FAQ</a>
          <a href="mailto:codewiki-feedback@google.com">Feedback</a>
          <a href="#">Terms</a>
          <a href="#">Privacy</a>
        </nav>
      </footer>
    </div>

    <script src="../script.js"></script>
  </body>
</html>
